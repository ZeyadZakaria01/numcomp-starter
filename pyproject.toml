[project]
name = "numcomp"
version = "0.1.0"
description = "Numerical Computing project: root finding on an n-significant-figure machine"
requires-python = ">=3.12"
dependencies = ["sympy==1.14.0", "matplotlib==3.10.7"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-timeout==2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["numcomp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 10
